<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: shrink the layout viewport when the software
         keyboard opens, so fixed bottom chrome sits above it instead of behind
         it while an athlete writes a note. Honoured by Chrome/Android; iOS
         ignores it and is handled by useKeyboardOpen in the athlete app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#185FA5" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
    <title>EMOS</title>
    <meta name="description" content="EMOS — Olympic weightlifting coaching platform for planning and monitoring training." />
    <link rel="canonical" href="https://emosapp.com/" />
    <meta property="og:title" content="EMOS" />
    <meta property="og:description" content="Olympic Weightlifting Coaching Platform" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://emosapp.com/" />
    <meta property="og:image" content="https://emosapp.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMOS" />
    <meta name="twitter:image" content="https://emosapp.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
