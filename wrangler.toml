# Cloudflare Workers deploy configuration for EMOS.
#
# EMOS is a client-side SPA: Vite builds `dist/`, and Supabase is called
# directly from the browser. The Worker script below exists ONLY for /api/*
# (run_worker_first) — every other request is served straight from assets and
# never executes worker code, so the app cannot be taken down by an /api bug.
#
# Current /api surface (worker/index.ts): Cloudflare Stream upload brokering,
# and KinEMOS video objects in R2. Both stay inert (503) until their
# configuration exists — see the worker's header comment.
#
# Chosen over Cloudflare Pages: Workers static assets is the platform
# Cloudflare actively develops, supports the same `_headers` / `_redirects`
# files, and allows exactly this kind of /api/* addition without moving hosts.
name = "emos"
main = "worker/index.ts"
compatibility_date = "2026-08-28"

# Versioned preview URLs (<version-id>-emos.<subdomain>.workers.dev) are
# PUBLIC, and they keep serving each version's own assets after that version
# stops being the live one. They default to matching the workers.dev setting,
# which is enabled — so the 0.60.1 deployment went on serving its sourcemaps
# from its preview URL even after the main hostname was fixed.
#
# This must live here, not only in the dashboard: the dashboard toggle is
# overwritten by the next `wrangler deploy`, and every push to main deploys.
#
# To re-enable previews later (they are genuinely useful — e.g. testing a CSP
# against a branch before it reaches production), flip this to true AND put
# them behind Cloudflare Access, so a preview is not world-readable.
preview_urls = false

# KinEMOS direct imports (docs/KINEMOS_DESIGN.md §4). Long-form footage that
# the 200 MB Supabase video buckets refuse, served back with Range support so
# the analysis viewer can seek. A native binding rather than the S3 API: no
# access keys exist to leak, and no presigned URL can expire mid-upload.
#
# Create the bucket once before the first deploy:
#   wrangler r2 bucket create emos-kinemos-videos
# Until the binding resolves, /api/kinemos/* answers 503 and the import UI
# reports storage as unconfigured — the rest of the app is unaffected.
[[r2_buckets]]
binding = "KINEMOS_VIDEOS"
bucket_name = "emos-kinemos-videos"

[assets]
directory = "./dist"

# Only /api/* executes the worker script; assets win everywhere else.
run_worker_first = ["/api/*"]

# Client-side routing: serve index.html (200, not 404) for navigation requests
# that don't match a built asset, so hard refreshes and deep links such as
# /analysis or /athlete/a/<id> survive. This replaces the Netlify
# `[[redirects]] /* -> /index.html 200` rule; Workers handles it natively so
# no `_redirects` file is needed.
not_found_handling = "single-page-application"
