# Cloudflare Workers (static assets) deploy configuration for EMOS.
#
# EMOS is a pure client-side SPA: Vite builds `dist/`, and Supabase is called
# directly from the browser. There is no server code, so this is an
# assets-only Worker — no `main`, and deliberately no `binding` (the ASSETS
# binding is only valid alongside a Worker script).
#
# Chosen over Cloudflare Pages: Workers static assets is the platform
# Cloudflare actively develops, supports the same `_headers` / `_redirects`
# files, and leaves a door open for R2-backed video or an /api/* route later
# (add `main` + `assets.run_worker_first = ["/api/*"]` at that point).
name = "emos"
compatibility_date = "2026-08-28"

[assets]
directory = "./dist"

# Client-side routing: serve index.html (200, not 404) for navigation requests
# that don't match a built asset, so hard refreshes and deep links such as
# /analysis or /athlete/a/<id> survive. This replaces the Netlify
# `[[redirects]] /* -> /index.html 200` rule; Workers handles it natively so
# no `_redirects` file is needed.
not_found_handling = "single-page-application"
